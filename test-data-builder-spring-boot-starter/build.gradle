description = 'Test Data Builder - Spring Boot Starter with auto-configuration'

dependencies {
    api project(':test-data-builder-core')

    // Provider modules - included transitively, auto-config picks the right one
    implementation project(':test-data-builder-jpa')
    implementation project(':test-data-builder-spring-data-jdbc')

    // Spring Boot
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure:3.5.8'

    // JPA and JDBC APIs for conditional checks
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    compileOnly 'org.springframework.data:spring-data-jdbc:3.4.2'

    // Testing
    testImplementation project(':test-data-builder-jpa')
    testImplementation project(':test-data-builder-spring-data-jdbc')
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.8'
    testImplementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    testImplementation 'org.springframework.data:spring-data-jdbc:3.4.2'
}
